# HUB RBAC SETUP - Hub Login: Authenticates to the ACM Hub and verifies identity.
# Requires a cluster-admin token or equivalent to create SAs and ClusterRoles.
- name: "[HUB RBAC - Hub Login] | Starting authentication"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_spoke_hub_rbac_setup_banner_title: "🔐 HUB RBAC - Hub Login (Cluster-Admin Authentication)"
    acm_spoke_hub_rbac_setup_banner_lines:
      - "🌐 Hub URL: {{ acm_spoke_hub_rbac_setup_hub_url }}"
      - "📌 SA Namespace: {{ acm_spoke_hub_rbac_setup_namespace }}"

- name: "[HUB RBAC - Hub Login] | 01.1) Verify required connection variables"
  ansible.builtin.assert:
    that:
      - acm_spoke_hub_rbac_setup_hub_url | default('') | length > 0
      - acm_spoke_hub_rbac_setup_hub_token | default('') | length > 0
    fail_msg: >-
      ❌ FAILED! => Required variables missing. Provide:
      acm_spoke_hub_rbac_setup_hub_url and acm_spoke_hub_rbac_setup_hub_token.
      The token must belong to a user with cluster-admin on the Hub.
    success_msg: >-
      ✅ OK! => Required connection variables defined.
      Hub: {{ acm_spoke_hub_rbac_setup_hub_url }}.

# oc login sets the current context to the Hub.
# The token must be cluster-admin to create SA + ClusterRole + CRB.
- name: "[HUB RBAC - Hub Login] | 01.2) Authenticate to ACM Hub via oc login"
  ansible.builtin.command: >
    oc login
    --token={{ acm_spoke_hub_rbac_setup_hub_token }}
    --server={{ acm_spoke_hub_rbac_setup_hub_url }}
    {% if not acm_spoke_hub_rbac_setup_validate_certs | bool %}--insecure-skip-tls-verify{% endif %}
  register: __hub_rbac_login_result
  changed_when: false
  failed_when: __hub_rbac_login_result.rc != 0
  no_log: "{{ acm_spoke_hub_rbac_setup_no_log }}"

- name: "[HUB RBAC - Hub Login] | 01.3) Verify authenticated identity"
  ansible.builtin.command: oc whoami
  register: __hub_rbac_whoami
  changed_when: false
  failed_when: __hub_rbac_whoami.rc != 0

- name: "[HUB RBAC - Hub Login] | 01.4) Confirm identity"
  ansible.builtin.debug:
    msg: "✅ Authenticated to ACM Hub as: {{ __hub_rbac_whoami.stdout }}"

- name: "[HUB RBAC - Hub Login] | Authentication complete"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_spoke_hub_rbac_setup_banner_title: "✅ HUB RBAC - Hub Login Completed"
    acm_spoke_hub_rbac_setup_banner_lines:
      - "Authenticated as: {{ __hub_rbac_whoami.stdout }}"
...
