---
# CI pipeline for dfmateus.acm_spoke collection.
# Runs on every PR targeting main and on pushes to main.
# Gates: yamllint, ansible-lint, ansible-test sanity, playbook syntax-check.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install yamllint ansible-lint
          ansible-galaxy collection install kubernetes.core

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - "2.18"
          - "2.19"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ansible_collections/dfmateus/acm_spoke

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install "ansible-core~=${{ matrix.ansible }}.0"

      - name: Install collection dependencies
        run: ansible-galaxy collection install kubernetes.core
        working-directory: ansible_collections/dfmateus/acm_spoke

      - name: Run ansible-test sanity
        run: ansible-test sanity --docker -v --color
        working-directory: ansible_collections/dfmateus/acm_spoke

  syntax:
    name: Playbook syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and dependencies
        run: |
          pip install "ansible-core>=2.18"
          ansible-galaxy collection install kubernetes.core

      - name: Syntax check all playbooks
        run: |
          for pb in playbooks/*.yml; do
            echo "--- Checking $pb ---"
            ansible-playbook --syntax-check "$pb"
          done
