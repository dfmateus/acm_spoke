# STAGE 03: Reads the ManagedServiceAccount Secret from the Hub namespace
# and extracts the spoke token + API URL.
- name: "[STAGE 03 - Read MSA] | Starting read"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_spoke_token_resolver_banner_title: "📖 STAGE 03 - Read MSA Secret"
    acm_spoke_token_resolver_banner_lines:
      - "MSA '{{ acm_spoke_token_resolver_msa_name }}' from namespace '{{ acm_spoke_token_resolver_target_cluster }}'"

# The Secret has the same name as the MSA CR and resides in the target
# cluster namespace on the Hub. The klusterlet creates and rotates it automatically.
- name: "[STAGE 03 - Read MSA] | 03.1) Look up MSA Secret in the Hub namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ acm_spoke_token_resolver_msa_name }}"
    namespace: "{{ acm_spoke_token_resolver_target_cluster }}"
  register: __acm_msa_secret_result
  no_log: "{{ acm_spoke_token_resolver_no_log }}"

- name: "[STAGE 03 - Read MSA] | 03.1) Assert MSA Secret was found"
  ansible.builtin.assert:
    that:
      - __acm_msa_secret_result.resources | length > 0
    fail_msg: >-
      ❌ FAILED! => MSA Secret '{{ acm_spoke_token_resolver_msa_name }}'
      not found in namespace '{{ acm_spoke_token_resolver_target_cluster }}' on the Hub.
      Check: (1) ManagedServiceAccount CR exists,
      (2) managed-serviceaccount addon is enabled,
      (3) klusterlet has reported the token.
      Command: oc get managedserviceaccount {{ acm_spoke_token_resolver_msa_name }}
      -n {{ acm_spoke_token_resolver_target_cluster }}
    success_msg: >-
      ✅ OK! => MSA Secret '{{ acm_spoke_token_resolver_msa_name }}'
      found in namespace '{{ acm_spoke_token_resolver_target_cluster }}'.

# The Secret's .data.token field contains the base64-encoded bearer token,
# issued by the klusterlet via TokenRequest on the spoke.
- name: "[STAGE 03 - Read MSA] | 03.2) Extract spoke token from the Secret"
  ansible.builtin.set_fact:
    acm_spoke_token_resolver_spoke_token: "{{ __acm_msa_secret_result.resources[0].data.token | b64decode }}"
  no_log: "{{ acm_spoke_token_resolver_no_log }}"

# The ManagedCluster CR was already queried and validated in Stage 02
# (registered as __acm_preflight_mc). Reuse it to avoid a duplicate API call.
- name: "[STAGE 03 - Read MSA] | 03.3) Assert ManagedCluster has clientConfigs"
  ansible.builtin.assert:
    that:
      - __acm_preflight_mc.resources[0].spec.managedClusterClientConfigs is defined
      - __acm_preflight_mc.resources[0].spec.managedClusterClientConfigs | length > 0
    fail_msg: >-
      ❌ FAILED! => ManagedCluster '{{ acm_spoke_token_resolver_target_cluster }}'
      has no clientConfigs. The cluster may not have been fully imported yet.
      Verify that the cluster is registered and available on the Hub.
    success_msg: >-
      ✅ OK! => ManagedCluster
      '{{ acm_spoke_token_resolver_target_cluster }}' found with API configuration.

- name: "[STAGE 03 - Read MSA] | 03.4) Set spoke API URL fact"
  ansible.builtin.set_fact:
    acm_spoke_token_resolver_spoke_api_url: >-
      {{ __acm_preflight_mc.resources[0].spec.managedClusterClientConfigs[0].url }}

- name: "[STAGE 03 - Read MSA] | 03.4) Spoke API URL resolved"
  ansible.builtin.debug:
    msg: >-
      ✅ Spoke API URL resolved: {{ acm_spoke_token_resolver_spoke_api_url }}

- name: "[STAGE 03 - Read MSA] | Read complete"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_spoke_token_resolver_banner_title: "📖 STAGE 03 - MSA Secret Read Complete"
    acm_spoke_token_resolver_banner_lines:
      - "MSA Secret read and spoke API URL resolution completed successfully"
...
