# STAGE 01: Authenticate to the ACM Hub and verify identity.
# Uses oc login with the Hub ServiceAccount token (read-only).
- name: "[STAGE 01 - Hub Login] | Starting authentication"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_spoke_token_resolver_banner_title: "🔐 STAGE 01 - Hub Login (ACM Hub Authentication)"
    acm_spoke_token_resolver_banner_lines:
      - "📌 Target Cluster: {{ acm_spoke_token_resolver_target_cluster }}"
      - "🌐 Hub URL: {{ acm_spoke_token_resolver_hub_url }}"

- name: "[STAGE 01 - Hub Login] | 01.1) Assert required connection variables"
  ansible.builtin.assert:
    that:
      - acm_spoke_token_resolver_hub_url | default('') | length > 0
      - acm_spoke_token_resolver_hub_token | default('') | length > 0
      - acm_spoke_token_resolver_target_cluster | default('') | length > 0
    fail_msg: >-
      ❌ FAILED! => Required variables missing. Provide:
      acm_spoke_token_resolver_hub_url, acm_spoke_token_resolver_hub_token
      and acm_spoke_token_resolver_target_cluster.
    success_msg: >-
      ✅ OK! => All required connection variables are set.
      Hub: {{ acm_spoke_token_resolver_hub_url }},
      Target cluster: {{ acm_spoke_token_resolver_target_cluster }}.

# oc login sets the current kubeconfig context to the Hub.
# The token belongs to a read-only SA that only reads MSA secrets and ManagedCluster CRs.
- name: "[STAGE 01 - Hub Login] | 01.2) Authenticate to ACM Hub via oc login"
  ansible.builtin.command: >
    oc login
    --token={{ acm_spoke_token_resolver_hub_token }}
    --server={{ acm_spoke_token_resolver_hub_url }}
    {% if not acm_spoke_token_resolver_validate_certs | bool %}--insecure-skip-tls-verify{% endif %}
  register: __acm_hub_login_result
  changed_when: false
  failed_when: __acm_hub_login_result.rc != 0
  no_log: "{{ acm_spoke_token_resolver_no_log }}"

- name: "[STAGE 01 - Hub Login] | 01.3) Verify authenticated identity"
  ansible.builtin.command: oc whoami
  register: __acm_hub_whoami
  changed_when: false
  failed_when: __acm_hub_whoami.rc != 0

- name: "[STAGE 01 - Hub Login] | 01.4) Confirm identity"
  ansible.builtin.debug:
    msg: "✅ Authenticated to ACM Hub as: {{ __acm_hub_whoami.stdout }}"

- name: "[STAGE 01 - Hub Login] | Authentication complete"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'reports/stage_banner.j2').split('\n') }}"
  vars:
    acm_spoke_token_resolver_banner_title: "✅ STAGE 01 - Hub Login Completed"
    acm_spoke_token_resolver_banner_lines:
      - "Authenticated as: {{ __acm_hub_whoami.stdout }}"
...
